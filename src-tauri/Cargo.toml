[package]
name = "aurora-tv"
version = "0.1.0"
description = "Aurora TV — Apple TV 风格的跨端 TVBox 客户端"
authors = ["Aurora TV"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aurora_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "json",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
